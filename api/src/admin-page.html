<!DOCTYPE html>
<html lang="fo">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Fossábúðin · Vørustýring</title>
<style>
  :root {
    --bg: #f6f3ec; --card: #fff; --ink: #2b2620; --bark: #7a6f5f;
    --line: #e4ddd0; --green: #3f6b4a; --green-lt: #eaf1ea;
    --red: #b0202f; --red-lt: #fbeced; --stone: #cbbfae;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.4;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: .8rem 1rem;
    display: flex; align-items: center; gap: .6rem;
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; flex: 1; }
  header .sub { color: var(--bark); font-weight: 400; font-size: .8rem; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1rem; }
  button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: .5rem .8rem; }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-ghost { background: transparent; }
  .btn-sm { padding: .3rem .55rem; font-size: .85rem; }
  /* Deliberately the largest control in the header — it is the one the owner
     looks for after a round of edits. */
  .btn-refresh {
    padding: .6rem 1.05rem; font-size: 1rem; font-weight: 700;
    border: 2px solid var(--green); color: var(--green); background: var(--green-lt);
    flex-shrink: 0;
  }
  .btn-refresh:hover { background: var(--green); color: #fff; }
  /* Neutral once something has been written, green again after a re-read. */
  .btn-refresh.stale {
    border-color: var(--bark); color: var(--ink); background: var(--card);
  }
  .btn-refresh.stale:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
  /* The bigger button leaves the title too little room on a phone; the subtitle
     is decorative, so drop it rather than let the heading wrap to two lines. */
  @media (max-width: 420px) { header .sub { display: none; } }
  .icon-btn { border: none; background: transparent; padding: .3rem .45rem; font-size: 1rem; }
  input[type=text], input[type=password] {
    font: inherit; width: 100%; padding: .65rem .7rem; border: 1px solid var(--line);
    border-radius: 9px; background: #fff; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--green-lt); border-color: var(--green); }

  /* login */
  #login { max-width: 360px; margin: 12vh auto; padding: 1.5rem; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
  #login h2 { margin: 0 0 .3rem; font-size: 1.2rem; }
  #login p { margin: 0 0 1rem; color: var(--bark); font-size: .9rem; }
  #login button { width: 100%; margin-top: .8rem; }
  .login-err { color: var(--red); font-size: .85rem; margin-top: .6rem; display: none; }

  .toolbar { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .toolbar .search { flex: 1; min-width: 160px; }

  .cat {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: .7rem; overflow: hidden; box-shadow: var(--shadow);
  }
  .cat-head { display: flex; align-items: center; gap: .55rem; padding: .7rem .8rem; }
  .cat-emoji { font-size: 1.25rem; }
  .cat-name { font-weight: 600; flex: 1; }
  .cat-count { color: var(--bark); font-size: .8rem; }
  .cat-move { display: flex; gap: .15rem; }
  .btn-move {
    border: 1px solid var(--line); background: #fff; color: var(--bark);
    border-radius: 6px; width: 26px; height: 26px; line-height: 1;
    font-size: .85rem; cursor: pointer; padding: 0;
  }
  .btn-move:hover:not(:disabled) { border-color: var(--bark); color: var(--ink); }
  .btn-move:disabled { opacity: .3; cursor: default; }
  .cat.hidden-group .cat-name { color: var(--bark); text-decoration: line-through; }
  .chev { transition: transform .2s; color: var(--bark); }
  .cat.open .chev { transform: rotate(90deg); }
  .cat-body { display: none; border-top: 1px solid var(--line); padding: .5rem .8rem .8rem; }
  .cat.open .cat-body { display: block; }
  .cat-actions { display: flex; gap: .4rem; margin: .3rem 0 .7rem; flex-wrap: wrap; }

  .item { display: flex; align-items: center; gap: .5rem; padding: .45rem 0; border-bottom: 1px dashed var(--line); }
  .item:last-child { border-bottom: none; }
  .item-name { flex: 1; }
  .item.out .item-name { color: var(--bark); text-decoration: line-through; }
  .badge { font-size: .68rem; padding: .12rem .4rem; border-radius: 999px; font-weight: 600; }
  .badge-out { background: var(--red-lt); color: var(--red); }

  /* switch */
  .sw { position: relative; width: 44px; height: 26px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: #cfc7b8; border-radius: 999px; transition: .18s; }
  .sw span::before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .18s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .sw input:checked + span { background: var(--green); }
  .sw input:checked + span::before { transform: translateX(18px); }

  .muted { color: var(--bark); }
  .empty { text-align: center; color: var(--bark); padding: 2rem 0; }

  /* ── Ja Takk Tilboð panel ── */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); margin-bottom: 1.2rem; overflow: hidden;
  }
  .panel-head { display: flex; align-items: center; gap: .5rem; padding: .75rem .8rem; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 1rem; font-weight: 700; flex: 1; }
  .panel-body { padding: .3rem .8rem .6rem; }

  .offer { display: flex; align-items: center; gap: .5rem; padding: .55rem 0; border-bottom: 1px dashed var(--line); }
  .offer:last-child { border-bottom: none; }
  .offer.off { opacity: .55; }
  .offer-emoji { font-size: 1.2rem; flex: none; width: 1.6rem; text-align: center; }
  .offer-main { flex: 1; min-width: 0; }
  .offer-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .offer-prices { font-size: .85rem; color: var(--bark); display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
  .offer-prices .old { text-decoration: line-through; }
  .offer-prices .new { color: var(--green); font-weight: 700; }
  .badge-pct { background: var(--green-lt); color: var(--green); }

  /* price form */
  .price-row { display: flex; gap: .5rem; margin-bottom: .7rem; }
  .price-row label { flex: 1; font-size: .8rem; color: var(--bark); }
  .price-row label input { margin-top: .2rem; }
  .price-row .emoji-field { flex: none; width: 74px; }
  .pct-preview { text-align: center; font-size: .9rem; color: var(--bark); margin: .2rem 0 .8rem; min-height: 1.3em; }
  .pct-preview strong { color: var(--green); font-size: 1.05rem; }
  .pct-preview.bad { color: var(--red); }
  .offer-for { font-size: .9rem; color: var(--bark); margin: -.4rem 0 .8rem; }

  /* product picker */
  .picker { max-height: 52vh; overflow-y: auto; margin: .6rem -.4rem 0; padding: 0 .4rem; }
  .pick-cat { border-bottom: 1px solid var(--line); }
  .pick-cat:last-child { border-bottom: none; }
  .pick-cat-head { display: flex; align-items: center; gap: .5rem; padding: .55rem .2rem; cursor: pointer; }
  .pick-cat-head .cat-name { font-weight: 600; }
  .pick-cat.open .chev { transform: rotate(90deg); }
  .pick-subs { display: none; padding: 0 0 .4rem .5rem; }
  .pick-cat.open .pick-subs { display: block; }
  .pick-item {
    display: flex; align-items: center; gap: .45rem; width: 100%; text-align: left;
    border: none; background: transparent; padding: .45rem .3rem; border-radius: 8px;
  }
  .pick-item:hover { background: var(--green-lt); }
  .pick-item .nm { flex: 1; }
  .pick-item .has { font-size: .7rem; color: var(--green); }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 20; padding: 1rem; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--card); border-radius: 14px; padding: 1.2rem; width: 100%; max-width: 380px; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 .8rem; font-size: 1.05rem; }
  .modal .row { display: flex; gap: .5rem; margin-bottom: .7rem; }
  .modal .row .emoji { width: 68px; text-align: center; }
  .modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: .4rem; }

  /* toast */
  #toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%) translateY(2rem); background: var(--ink); color: #fff; padding: .6rem 1rem; border-radius: 10px; opacity: 0; transition: .25s; z-index: 30; font-size: .9rem; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--red); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h2>Vørustýring</h2>
  <p>Rita inn við tínum loyniorði fyri at broyta vørur og goymslu.</p>
  <input type="password" id="pw" placeholder="Loyniorð" autocomplete="current-password" />
  <button class="btn-primary" id="loginBtn">Rita inn</button>
  <div class="login-err" id="loginErr">Skeivt loyniorð. Royn aftur.</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <div style="flex:1">
      <h1>Fossábúðin <span class="sub">· vørustýring</span></h1>
    </div>
    <button class="btn-refresh" id="refreshBtn">↻ Dagfør</button>
    <button class="btn-ghost btn-sm" id="logoutBtn">Rita út</button>
  </header>
  <div class="wrap">

    <!-- JA TAKK TILBOÐ -->
    <div class="panel" id="offersPanel">
      <div class="panel-head">
        <h2>Ja Takk Tilboð</h2>
        <button class="btn-primary btn-sm" id="addOfferBtn">＋ Nýtt tilboð</button>
      </div>
      <div class="panel-body" id="offersList"></div>
    </div>

    <div class="toolbar">
      <input type="text" class="search" id="search" placeholder="Leita eftir vøru ella bólki…" />
      <button class="btn-primary" id="addCatBtn">+ Nýggjur bólkur</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="row">
      <input type="text" class="emoji" id="modalEmoji" placeholder="🛒" maxlength="4" style="display:none" />
      <input type="text" id="modalInput" placeholder="Navn" />
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancel">Avlýs</button>
      <button class="btn-primary" id="modalOk">Goym</button>
    </div>
  </div>
</div>

<!-- PRODUCT PICKER (for Ja Takk Tilboð) -->
<div class="modal-bg" id="pickBg">
  <div class="modal">
    <h3>Vel Vøru</h3>
    <input type="text" id="pickSearch" placeholder="Leita eftir vøru…" />
    <div class="picker" id="pickList"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="pickCancel">Avlýs</button>
    </div>
  </div>
</div>

<!-- PRICE FORM (for Ja Takk Tilboð) -->
<div class="modal-bg" id="priceBg">
  <div class="modal">
    <h3 id="priceTitle">Ja Takk Tilboð</h3>
    <p class="offer-for" id="priceFor"></p>
    <div class="price-row">
      <label class="emoji-field">Ikon<input type="text" id="priceEmoji" maxlength="4" placeholder="🛒" /></label>
      <label>Upprunaligi prísur (valfrítt)<input type="text" id="priceOld" inputmode="decimal" placeholder="15,50" /></label>
      <label>Ja Takk Prísur<input type="text" id="priceNew" inputmode="decimal" placeholder="12,00" /></label>
    </div>
    <div class="pct-preview" id="pctPreview"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="priceCancel">Avlýs</button>
      <button class="btn-primary" id="priceOk">Goym</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = location.origin;
const TOKEN_KEY = "fb_admin_token";
let token = sessionStorage.getItem(TOKEN_KEY) || "";
let catalog = [];
let offers = [];
let openCats = new Set();   // category ids the user has expanded (kept across re-renders)

/* ---------- helpers ---------- */

/* Dagfør re-reads the catalog from the database into this page. Green means
   "I have looked at the full list since the last change"; neutral means a
   change was made that has not been re-viewed. Cleared ONLY by an explicit
   Dagfør click (or the initial load after logging in) — several actions below
   also call load() on their own, to refresh THEIR local state after a write,
   but that must not by itself count as the owner reviewing the list, so it
   does not touch this flag. This is about THIS PAGE being current — every
   change is saved to the database the moment it is made, and the shop site
   reads that database on every visit, so nothing is ever waiting to be
   published. */
let viewStale = false;
function setViewStale(stale) {
  viewStale = stale;
  const b = document.getElementById("refreshBtn");
  if (!b) return;
  b.classList.toggle("stale", stale);
  b.title = stale
    ? "Broytingar eru goymdar. Trýst fyri at endurlesa listan."
    : "Listin er tann sami sum í dátugrunninum.";
}

function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  setTimeout(() => (t.className = ""), 2200);
}
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { "content-type": "application/json", "authorization": "Bearer " + token, ...(opts.headers || {}) },
  });
  if (res.status === 401) { logout(); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({ ok: false }));
  if (!data.ok) throw new Error(data.error || "villa");
  // Any successful write means this page's copy of the catalog may now differ
  // from the database. Done here so every present and future write counts.
  if ((opts.method || "GET") !== "GET") setViewStale(true);
  return data;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

/* ---------- modal (text + optional emoji) ---------- */
function askText({ title, value = "", emoji = null, placeholder = "Navn" }) {
  return new Promise(resolve => {
    const bg = document.getElementById("modalBg");
    document.getElementById("modalTitle").textContent = title;
    const input = document.getElementById("modalInput");
    const em = document.getElementById("modalEmoji");
    input.value = value; input.placeholder = placeholder;
    if (emoji === null) { em.style.display = "none"; }
    else { em.style.display = "block"; em.value = emoji; }
    bg.classList.add("show"); setTimeout(() => input.focus(), 50);
    const done = (val) => { bg.classList.remove("show"); cleanup(); resolve(val); };
    const ok = () => { const name = input.value.trim(); if (!name) return; done({ name, emoji: emoji === null ? undefined : (em.value.trim() || null) }); };
    const cancel = () => done(null);
    function key(e) { if (e.key === "Enter") ok(); if (e.key === "Escape") cancel(); }
    function cleanup() {
      document.getElementById("modalOk").onclick = null;
      document.getElementById("modalCancel").onclick = null;
      input.removeEventListener("keydown", key); em.removeEventListener("keydown", key);
    }
    document.getElementById("modalOk").onclick = ok;
    document.getElementById("modalCancel").onclick = cancel;
    input.addEventListener("keydown", key); em.addEventListener("keydown", key);
  });
}

/* ---------- auth ---------- */
async function tryLogin(pw) {
  token = pw;
  await api("/admin/catalog");           // 401 throws -> caught by caller
  sessionStorage.setItem(TOKEN_KEY, pw);
}
function logout() {
  token = ""; sessionStorage.removeItem(TOKEN_KEY);
  document.getElementById("app").style.display = "none";
  document.getElementById("login").style.display = "block";
}

/* ---------- data ---------- */
async function load() {
  const [cat, off] = await Promise.all([api("/admin/catalog"), api("/admin/offers")]);
  catalog = cat.catalog || [];
  offers = off.offers || [];
  render();
  renderOffers();
}

/* Each category currently has one product; treat category+product[0] as a group. */
function groupProduct(cat) { return (cat.products && cat.products[0]) || null; }

/* ---------- render ---------- */
function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";
  let shown = 0;

  catalog.forEach((cat, idx) => {
    const prod = groupProduct(cat);
    const items = prod ? (prod.sub_items || []) : [];
    const matchCat = q === "" || cat.name.toLowerCase().includes(q);
    const matchItems = items.filter(s => q === "" || s.name.toLowerCase().includes(q));
    if (q !== "" && !matchCat && matchItems.length === 0) return;
    shown++;

    const visibleItems = (q !== "" && !matchCat) ? matchItems : items;
    const groupHidden = prod && !prod.in_stock;

    const el = document.createElement("div");
    const isOpen = q !== "" || openCats.has(cat.id);
    el.className = "cat" + (isOpen ? " open" : "") + (groupHidden ? " hidden-group" : "");

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML =
      '<span class="cat-emoji">' + esc(cat.emoji || "🛒") + '</span>' +
      '<span class="cat-name">' + esc(cat.name) + '</span>' +
      '<span class="cat-count">' + items.length + ' vørur</span>' +
      // Hidden while searching: the list is filtered then, so "up" would move the
      // category past rows the user cannot see.
      (q === ""
        ? '<span class="cat-move">' +
            '<button class="btn-move" title="Flyt upp"' + (idx === 0 ? " disabled" : "") + '>↑</button>' +
            '<button class="btn-move" title="Flyt niður"' + (idx === catalog.length - 1 ? " disabled" : "") + '>↓</button>' +
          '</span>'
        : "") +
      '<span class="chev">›</span>';
    head.onclick = () => {
      const nowOpen = el.classList.toggle("open");
      if (nowOpen) openCats.add(cat.id); else openCats.delete(cat.id);
    };
    head.querySelectorAll(".btn-move").forEach((btn, i) => {
      btn.onclick = (e) => { e.stopPropagation(); moveCategory(idx, i === 0 ? -1 : 1); };
    });
    el.appendChild(head);

    const body = document.createElement("div");
    body.className = "cat-body";

    // group-level actions
    const actions = document.createElement("div");
    actions.className = "cat-actions";
    actions.innerHTML =
      '<button class="btn-sm">' + (groupHidden ? "👁 Vís bólk" : "🚫 Fjal bólk") + '</button>' +
      '<button class="btn-sm">✏️ Broyt navn</button>' +
      '<button class="btn-sm">＋ Vøra</button>' +
      '<button class="btn-sm" style="color:var(--red)">🗑 Strika bólk</button>';
    const [hideBtn, renameBtn, addBtn, delBtn] = actions.querySelectorAll("button");
    hideBtn.onclick = (e) => { e.stopPropagation(); if (prod) toggleStock("product", prod.id, !prod.in_stock); };
    renameBtn.onclick = (e) => { e.stopPropagation(); renameGroup(cat, prod); };
    addBtn.onclick = (e) => { e.stopPropagation(); addItem(cat, prod); };
    delBtn.onclick = (e) => { e.stopPropagation(); deleteGroup(cat); };
    body.appendChild(actions);

    // items
    if (visibleItems.length === 0) {
      const p = document.createElement("p");
      p.className = "muted"; p.style.fontSize = ".9rem"; p.textContent = "Ongar vørur enn.";
      body.appendChild(p);
    }
    visibleItems.forEach(sub => body.appendChild(itemRow(sub)));

    el.appendChild(body);
    list.appendChild(el);
  });

  if (shown === 0) {
    list.innerHTML = '<p class="empty">' + (q ? "Einki funnið." : "Ongir bólkar enn. Legg ein afturat.") + '</p>';
  }
}

function itemRow(sub) {
  const row = document.createElement("div");
  row.className = "item" + (sub.in_stock ? "" : " out");
  const badge = sub.in_stock ? "" : '<span class="badge badge-out">Uppselt</span>';
  row.innerHTML =
    '<label class="sw"><input type="checkbox" ' + (sub.in_stock ? "checked" : "") + '><span></span></label>' +
    '<span class="item-name">' + esc(sub.name) + '</span>' + badge +
    '<button class="icon-btn" title="Broyt navn">✏️</button>' +
    '<button class="icon-btn" title="Strika">🗑</button>';
  const cb = row.querySelector("input");
  const [renameB, delB] = row.querySelectorAll(".icon-btn");
  cb.onchange = () => toggleStock("sub_item", sub.id, cb.checked);
  renameB.onclick = () => renameItem(sub);
  delB.onclick = () => deleteItem(sub);
  return row;
}

/* ---------- actions ---------- */
async function toggleStock(kind, id, inStock) {
  try {
    await api("/admin/toggle", { method: "POST", body: JSON.stringify({ kind, id, in_stock: inStock ? 1 : 0 }) });
    // update local state
    catalog.forEach(cat => {
      const prod = groupProduct(cat); if (!prod) return;
      if (kind === "product" && prod.id === id) prod.in_stock = inStock;
      (prod.sub_items || []).forEach(s => { if (kind === "sub_item" && s.id === id) s.in_stock = inStock; });
    });
    render();
    toast(inStock ? "Sett til áfylt" : "Sett til uppselt");
  } catch (e) { toast("Villa: " + e.message, true); load(); }
}

async function addItem(cat, prod) {
  const r = await askText({ title: "Legg vøru afturat “" + cat.name + "”", placeholder: "T.d. Bónda mjólk 1L" });
  if (!r) return;
  try {
    let productId = prod && prod.id;
    if (!productId) { // category has no product yet — create one matching the category
      const p = await api("/admin/product", { method: "POST", body: JSON.stringify({ category_id: cat.id, name: cat.name, emoji: cat.emoji, type: "expandable" }) });
      productId = p.id;
    }
    await api("/admin/sub-item", { method: "POST", body: JSON.stringify({ product_id: productId, name: r.name }) });

}

/* Move a category one step. New categories are always appended last, so this is
   the only way to get one where it belongs. Reorders locally and re-renders
   first so the list does not jump, then sends the whole order; on failure it
   reloads from the server rather than leaving the screen lying. */
async function moveCategory(idx, dir) {
  const to = idx + dir;
  if (to < 0 || to >= catalog.length) return;
  [catalog[idx], catalog[to]] = [catalog[to], catalog[idx]];
  render();
  try {
    await api("/admin/categories/reorder", {
      method: "POST",
      body: JSON.stringify({ ids: catalog.map(c => c.id) }),
    });
  } catch (e) {
    toast("Villa: " + e.message, true);
    await load();
  }
}

/* ================= Ja Takk Tilboð ================= */

/** "12" for whole krónur, "12,50" otherwise — Faroese uses a decimal comma. */
function fmtPrice(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return "—";
  return Math.round(v * 100) % 100 === 0 ? String(Math.round(v)) : v.toFixed(2).replace(".", ",");
}
/** Accept both "12,50" and "12.50" from the price boxes. */
function parsePriceInput(s) {
  if (s == null) return null;
  const t = String(s).replace(",", ".").trim();
  if (t === "") return null;
  const n = Number(t);
  return Number.isFinite(n) && n >= 0 ? n : null;
}
/** The emoji an offer would show if it had no override of its own. */
function inheritedEmoji(subItemId) {
  for (const cat of catalog) {
    const prod = groupProduct(cat);
    if (prod && (prod.sub_items || []).some(s => s.id === subItemId)) return prod.emoji || cat.emoji || "";
  }
  return "";
}

function renderOffers() {
  const box = document.getElementById("offersList");
  box.innerHTML = "";
  if (!offers.length) {
    box.innerHTML = '<p class="muted" style="font-size:.9rem;padding:.6rem 0">Ongi tilboð enn. Trýst á “＋ Nýtt tilboð”.</p>';
    return;
  }
  offers.forEach(o => box.appendChild(offerRow(o)));
}

function offerRow(o) {
  const row = document.createElement("div");
  row.className = "offer" + (o.active ? "" : " off");
  const pct = o.pct == null ? "" : '<span class="badge badge-pct">−' + o.pct + '%</span>';
  // Upprunaligi prísur is optional — no old price means no strikethrough/pct.
  const old = o.price_old == null ? "" : '<span class="old">' + fmtPrice(o.price_old) + ' kr</span>';
  // Offers never hide themselves, so flag a sold-out item here as a warning.
  const soldOut = o.in_stock ? "" : ' <span class="badge badge-out">Uppselt</span>';
  row.innerHTML =
    '<label class="sw"><input type="checkbox" ' + (o.active ? "checked" : "") + '><span></span></label>' +
    '<span class="offer-emoji">' + esc(o.emoji || "🛒") + '</span>' +
    '<div class="offer-main">' +
      '<div class="offer-name">' + esc(o.name) + soldOut + '</div>' +
      '<div class="offer-prices">' +
        old +
        '<span class="new">' + fmtPrice(o.price_new) + ' kr</span>' + pct +
      '</div>' +
    '</div>' +
    '<button class="icon-btn" title="Broyt prís">✏️</button>' +
    '<button class="icon-btn" title="Strika">🗑</button>';
  const cb = row.querySelector("input");
  const [editB, delB] = row.querySelectorAll(".icon-btn");
  cb.onchange = () => toggleOffer(o, cb.checked);
  editB.onclick = () => editOffer(o);
  delB.onclick = () => deleteOffer(o);
  return row;
}

/* ---------- product picker: category -> variant ---------- */
function pickSubItem() {
  return new Promise(resolve => {
    const bg = document.getElementById("pickBg");
    const search = document.getElementById("pickSearch");
    const list = document.getElementById("pickList");
    const openPick = new Set();
    search.value = "";

    function draw() {
      const q = search.value.trim().toLowerCase();
      list.innerHTML = "";
      let shown = 0;
      catalog.forEach(cat => {
        const prod = groupProduct(cat);
        const subs = prod ? (prod.sub_items || []) : [];
        const matchCat = q === "" || cat.name.toLowerCase().includes(q);
        const matched = subs.filter(s => q === "" || s.name.toLowerCase().includes(q));
        const visible = (q !== "" && !matchCat) ? matched : subs;
        if (!visible.length) return;
        shown++;

        const el = document.createElement("div");
        el.className = "pick-cat" + (q !== "" || openPick.has(cat.id) ? " open" : "");
        const head = document.createElement("div");
        head.className = "pick-cat-head";
        head.innerHTML =
          '<span class="cat-emoji">' + esc(cat.emoji || "🛒") + '</span>' +
          '<span class="cat-name">' + esc(cat.name) + '</span>' +
          '<span class="cat-count">' + visible.length + '</span>' +
          '<span class="chev">›</span>';
        head.onclick = () => {
          const nowOpen = el.classList.toggle("open");
          if (nowOpen) openPick.add(cat.id); else openPick.delete(cat.id);
        };
        el.appendChild(head);

        const wrap = document.createElement("div");
        wrap.className = "pick-subs";
        visible.forEach(sub => {
          const b = document.createElement("button");
          b.className = "pick-item";
          const already = offers.some(o => o.sub_item_id === sub.id);
          b.innerHTML = '<span class="nm">' + esc(sub.name) + '</span>' +
                        (already ? '<span class="has">á tilboði</span>' : '');
          b.onclick = () => done({ sub, cat, prod });
          wrap.appendChild(b);
        });
        el.appendChild(wrap);
        list.appendChild(el);
      });
      if (!shown) list.innerHTML = '<p class="empty">Einki funnið.</p>';
    }

    function key(e) { if (e.key === "Escape") done(null); }
    const done = (val) => {
      bg.classList.remove("show");
      search.oninput = null;
      document.getElementById("pickCancel").onclick = null;
      document.removeEventListener("keydown", key);
      resolve(val);
    };
    search.oninput = draw;
    document.getElementById("pickCancel").onclick = () => done(null);
    document.addEventListener("keydown", key);
    bg.classList.add("show");
    draw();
    setTimeout(() => search.focus(), 50);
  });
}

/* ---------- price form with a live −% preview ---------- */
function priceForm({ title, forText, emoji = "", priceOld = "", priceNew = "" }) {
  return new Promise(resolve => {
    const bg = document.getElementById("priceBg");
    document.getElementById("priceTitle").textContent = title;
    document.getElementById("priceFor").textContent = forText;
    const em = document.getElementById("priceEmoji");
    const po = document.getElementById("priceOld");
    const pn = document.getElementById("priceNew");
    const prev = document.getElementById("pctPreview");
    em.value = emoji || "";
    po.value = priceOld === "" || priceOld == null ? "" : fmtPrice(priceOld);
    pn.value = priceNew === "" ? "" : fmtPrice(priceNew);

    function upd() {
      const o = parsePriceInput(po.value), n = parsePriceInput(pn.value);
      if (po.value.trim() === "" || n === null) { prev.className = "pct-preview"; prev.textContent = ""; return; }
      if (o === null) { prev.className = "pct-preview"; prev.textContent = ""; return; }
      if (n >= o) {
        prev.className = "pct-preview bad";
        prev.textContent = "Ja Takk prísurin má vera lægri enn upprunaligi prísurin.";
        return;
      }
      prev.className = "pct-preview";
      prev.innerHTML = "Avsláttur: <strong>−" + Math.round((o - n) / o * 100) + "%</strong>";
    }

    function key(e) { if (e.key === "Enter") ok(); if (e.key === "Escape") cancel(); }
    function cleanup() {
      document.getElementById("priceOk").onclick = null;
      document.getElementById("priceCancel").onclick = null;
      [em, po, pn].forEach(i => { i.removeEventListener("keydown", key); i.oninput = null; });
    }
    const done = (val) => { bg.classList.remove("show"); cleanup(); resolve(val); };
    const cancel = () => done(null);
    const ok = () => {
      const oldEmpty = po.value.trim() === "";
      const o = oldEmpty ? null : parsePriceInput(po.value);
      const n = parsePriceInput(pn.value);
      if (n === null) {
        prev.className = "pct-preview bad";
        prev.textContent = "Skriva Ja Takk prísin.";
        return;
      }
      if (!oldEmpty && o === null) {
        prev.className = "pct-preview bad";
        prev.textContent = "Ógildigur upprunaligur prísur.";
        return;
      }
      if (o !== null && n >= o) { upd(); return; }
      done({ price_old: o, price_new: n, emoji: em.value.trim() });
    };

    document.getElementById("priceOk").onclick = ok;
    document.getElementById("priceCancel").onclick = cancel;
    [em, po, pn].forEach(i => i.addEventListener("keydown", key));
    [po, pn].forEach(i => (i.oninput = upd));
    upd();
    bg.classList.add("show");
    setTimeout(() => po.focus(), 50);
  });
}

/* ---------- offer actions ---------- */
async function addOffer() {
  const picked = await pickSubItem();
  if (!picked) return;
  const existing = offers.find(o => o.sub_item_id === picked.sub.id);
  const inherited = (picked.prod && picked.prod.emoji) || picked.cat.emoji || "";
  const r = await priceForm({
    title: existing ? "Broyt tilboð" : "Nýtt Ja Takk Tilboð",
    forText: picked.cat.name + " · " + picked.sub.name,
    emoji: existing ? (existing.emoji_override || inherited) : inherited,
    priceOld: existing ? existing.price_old : "",
    priceNew: existing ? existing.price_new : "",
  });
  if (!r) return;
  try {
    await api("/admin/offer", {
      method: "POST",
      body: JSON.stringify({
        sub_item_id: picked.sub.id,
        price_old: r.price_old,
        price_new: r.price_new,
        // only store the emoji when it differs, so it keeps following the product
        emoji: r.emoji === inherited ? null : r.emoji,
      }),
    });
    toast(existing ? "Tilboð dagført" : "Tilboð stovnað");
    await load();
  } catch (e) { toast("Villa: " + e.message, true); }
}

async function editOffer(o) {
  const inherited = inheritedEmoji(o.sub_item_id);
  const r = await priceForm({
    title: "Broyt tilboð",
    forText: o.category_name ? o.category_name + " · " + o.name : o.name,
    emoji: o.emoji_override || inherited,
    priceOld: o.price_old,
    priceNew: o.price_new,
  });
  if (!r) return;
  try {
    await api("/admin/offer/" + o.id, {
      method: "PATCH",
      body: JSON.stringify({
        price_old: r.price_old,
        price_new: r.price_new,
        emoji: r.emoji === inherited ? null : r.emoji,
      }),
    });
    toast("Tilboð dagført");
    await load();
  } catch (e) { toast("Villa: " + e.message, true); }
}

async function toggleOffer(o, active) {
  try {
    await api("/admin/offer/" + o.id, { method: "PATCH", body: JSON.stringify({ active: active ? 1 : 0 }) });
    o.active = active;
    renderOffers();
    toast(active ? "Tilboð víst" : "Tilboð fjalt");
  } catch (e) { toast("Villa: " + e.message, true); load(); }
}

async function deleteOffer(o) {
  if (!confirm("Strika tilboðið á “" + o.name + "”?")) return;
  try {
    await api("/admin/offer/" + o.id, { method: "DELETE" });
    toast("Tilboð strikað");
    await load();
  } catch (e) { toast("Villa: " + e.message, true); }
}

};
